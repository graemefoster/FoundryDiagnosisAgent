name: Publish Skills

on:
  push:
    branches: [main]
    paths:
      - "src/skills/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.5.0
        with:
          versionSpec: "6.x"

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.5.0

      - name: Validate skills
        run: gh skill publish src/skills --dry-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish skills
        run: gh skill publish src/skills --tag "skills-v${{ steps.gitversion.outputs.fullSemVer }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
